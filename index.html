<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gethin Portfolio</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0a1a33; /* Navy blue */
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 10px;
        backdrop-filter: blur(5px);
    }

    input[type="password"] {
        padding: 12px;
        width: 220px;
        border: none;
        border-radius: 5px;
        margin-top: 10px;
        font-size: 16px;
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        background-color: white;
        color: #0a1a33;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background-color: #dfe6f2;
    }

    #error {
        margin-top: 15px;
        color: #ff6b6b;
        font-size: 14px;
        display: none;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Enter password</h2>
    <input type="password" id="pass" placeholder="Password">
    <br>
    <button onclick="checkPass()">Enter</button>
    <div id="error">Incorrect - try again</div>
</div>

<script>
function checkPass() {
    const code = document.getElementById("pass").value;
    const error = document.getElementById("error");

    if (code === "101") {
        window.location.href = "home.html";
    } else {
        error.style.display = "block";
    }
}
</script>

</body>
</html>
